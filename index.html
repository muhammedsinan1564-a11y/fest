<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Festize</title>
    <meta
      name="description"
      content="Festize runs an entire inter-house arts festival from one browser tab: live championship standings, program tabulation, multi-stage scheduling, backstage ops, a poster & badge design studio, print-ready gazettes, analytics, quizmaster stage, stage stopwatch and a tabulation toolkit."
    />
    <meta name="theme-color" content="#F7F6F2" />
    <script>
      // Apply the saved site theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("festize-site-theme");
        var ok = ["obsidian", "sapphire", "emerald", "amethyst", "rose", "light", "paper"].indexOf(t) >= 0;
        document.documentElement.dataset.theme = ok ? (t === "paper" ? "light" : t) : "obsidian";
      } catch (e) {
        document.documentElement.dataset.theme = "obsidian";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600..800;1,500..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased selection:bg-rose-500/20 selection:text-rose-600">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
