# Supabase local development configuration for Festize.
# Run `supabase start` (Supabase CLI) to spin up the local stack,
# then apply migrations with `supabase db reset`.

project_id = "festize-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600

[analytics]
enabled = false
